# -*- coding: utf-8 -*-
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = [".workbuddy", "site", "reports", "assets", "data"]

[tool.ruff.lint]
# 只开最基础的规则：语法级错误 + pyflakes（未定义名/未使用变量），
# 不引入格式类规则，避免一次性的全库重排把 diff 搅浑。
select = ["E4", "E7", "E9", "F"]
# 历史脚本的既有写法，不影响正确性：
#   E402 —— scripts/ 先 sys.path.insert 再 import（有意的）
#   E731 —— gen2 里按列取值的小 lambda（sorted key 的简写）
#   E741 —— tech.py 里的 l（low），属 K 线四价的约定俗成
ignore = ["E402", "E731", "E741"]
